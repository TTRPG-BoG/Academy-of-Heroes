<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Academy of Heroes — Character Database</title>
  <meta name="description" content="Browse the Academy of Heroes character database. Explore NPCs, students, and teachers with detailed profiles, images, and information.">
  <meta name="author" content="Academy of Heroes">
  <meta name="theme-color" content="#2c3e50">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Academy of Heroes — Character Database">
  <meta property="og:description" content="Browse the Academy of Heroes character database. Explore NPCs, students, and teachers with detailed profiles.">
  <meta property="og:type" content="website">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Academy of Heroes — Character Database">
  <meta name="twitter:description" content="Browse the Academy of Heroes character database.">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="icons/site.webmanifest">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="css/main.css?v=10">

</head>
<body>
  <!-- Skip Navigation Link (Accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <!-- Noscript Warning -->
  <noscript>
    <div class="noscript-warning" role="alert">
      <strong>JavaScript Required:</strong> This application requires JavaScript to function. 
      Please enable JavaScript in your browser settings.
    </div>
  </noscript>
  
  <!-- Left Sidebar - Categories Navigation -->
  <nav id="sidebar" aria-label="Character categories">
    <h1 class="site-title">Academy of Heroes</h1>
    <div id="category-list"></div>
  </nav>
  
  <!-- Subcategories Bar (Mobile only - shown below sidebar) -->
  <nav id="subcategories" aria-label="Subcategories"></nav>
  
  <!-- Main Content Area -->
  <div id="main">
    <!-- Search Bar -->
    <div id="search-container">
      <label for="search-input" class="visually-hidden">Search the character database</label>
      <input 
        type="search" 
        id="search-input" 
        placeholder="Search characters and categories..." 
        autocomplete="off"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="search-results"
        aria-expanded="false"
        aria-haspopup="listbox">
      <!-- Search Results Dropdown -->
      <div id="search-results" role="listbox" aria-label="Search results"></div>
    </div>
    
    <!-- Content Panels -->
    <div id="content">
      <!-- Items Grid -->
      <main id="main-content">
        <div id="items-grid" role="list" aria-label="Characters"></div>
      </main>
      
      <!-- Info Panel -->
      <aside id="info-panel" role="complementary" aria-label="Character information"></aside>
      
      <!-- Image Panel -->
      <aside id="image-panel" role="complementary" aria-label="Character image"></aside>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- External JavaScript -->
  <script src="js/app.js?v=12" defer></script>
</body>
</html>
