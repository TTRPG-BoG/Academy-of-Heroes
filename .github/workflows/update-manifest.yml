name: Update Database Manifest

# Trigger on every push to main
on:
  push:
    branches:
      - main

permissions:
  contents: write  # allow committing back to repo

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code (with write creds)
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Set up the supported Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Regenerate the manifest and validate the site
      - name: Generate and validate the site
        run: npm run check

      # 4. Commit and push the updated manifest
      - name: Commit manifest.json
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "chore: update database manifest"
          add: database/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

